[package]
name = "ecopoint"
version = "0.1.0"
edition = "2021"

[dependencies]
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# ==========================
# Requisições HTTP (E-mail API)
# ==========================
reqwest = { version = "0.12", features = ["json"] }

# ==========================
# Web Framework
# ==========================
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# ==========================
# Templates
# ==========================
askama = "0.14"

# ==========================
# Banco de Dados
# ==========================
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros"
] }

# ==========================
# Serialização
# ==========================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ==========================
# Datas
# ==========================
chrono = { version = "0.4", features = ["serde"] }

# ==========================
# UUID
# ==========================
uuid = { version = "1", features = [
    "v4",
    "serde"
] }

# ==========================
# JWT
# ==========================
jsonwebtoken = "9"

# ==========================
# Hash de senha
# ==========================
argon2 = "0.5"

# ==========================
# Cookies
# ==========================
tower-cookies = "0.11"

# ==========================
# Configuração
# ==========================
dotenvy = "0.15"

# ==========================
# Logs
# ==========================
tracing = "0.1"
tracing-subscriber = "0.3"

# ==========================
# Tratamento de erros
# ==========================
anyhow = "1"

# ==========================
# Traits assíncronas
# ==========================
async-trait = "0.1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"