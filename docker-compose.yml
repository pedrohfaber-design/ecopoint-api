services:
  postgres:
    image: postgres:16
    container_name: ecopoint-db
    restart: always

    environment:
      POSTGRES_USER: ecopoint
      POSTGRES_PASSWORD: ecopoint123
      POSTGRES_DB: ecopoint

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: